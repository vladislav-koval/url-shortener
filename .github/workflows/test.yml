name: Go Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  proto-check:
    name: Check generated proto code
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Set up env file
        run: cp .env.example .env

      - name: Install proto tools
        run: make tools

      - name: Lint proto files
        run: make proto-lint

      - name: Check generated proto code is up to date
        run: make proto-check

  run-tests:
    name: Run tests
    needs: proto-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run go test
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate Coverage Report
        run: |
          echo "### Отчет по покрытию кода :test_tube:" >> $GITHUB_STEP_SUMMARY
          
          # Исключаем файлы автосгенерированных моков, чтобы они не занижали статистику
          grep -v "/mocks" coverage.out > coverage.clean.out
          
          TOTAL_COVERAGE=$(go tool cover -func=coverage.clean.out | grep total | awk '{print $3}')
          
          echo "Test coverage: $TOTAL_COVERAGE" >> $GITHUB_STEP_SUMMARY